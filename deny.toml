# `cargo deny` configuration.
#
# The substrate prohibitions below govern what this crate *ships*, so the
# graph excludes dev-dependencies. ADR 0055 names a runtime substrate
# contract, and the atlas conformance scan measures it the same way -- "a
# member's resolved runtime dependency tables". `proptest` reaching
# `num-traits` is a property-testing dependency, not a numeric-abstraction
# choice, and banning it would be enforcing the rule's letter against its
# subject. ares settled this the same way for the same pair.
[graph]
exclude-dev = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# The atlas substrate contract (ADR 0055): each of these duplicates a
# capability the stack owns first-party, so a runtime dependency on one is an
# architecture defect rather than a preference. `nalgebra` and `ndarray`
# against `leto`, `rayon` against `moirai`, `num-traits` against `eunomia`.
deny = [
    { name = "nalgebra" },
    { name = "ndarray" },
    { name = "rayon" },
    { name = "num-traits" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/ryancinsight/aequitas",
    "https://github.com/ryancinsight/eunomia",
    "https://github.com/ryancinsight/leto",
    "https://github.com/ryancinsight/horae",
]